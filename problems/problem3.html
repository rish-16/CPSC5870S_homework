<!DOCTYPE html>
<html lang="en">
<head>
    <title>CPSC 487/587</title>
    <script src="../../js/setup/setup_mathjax.js"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/10.3.0/math.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quaternion@1.5.1/quaternion.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/numeric@1.2.6/numeric-1.2.6.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stats.js@0.17.0/build/stats.min.js"></script>
    <script type="importmap">
        {
            "imports": {
              "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
              "three/": "https://unpkg.com/three@0.160.0/"
            }
        }
    </script>
</head>
<body>
    <script type="module">

        import { ThreeEngine, get_default_lil_gui, refresh_displays } from "../../js/utils/utils_three.js";
        import { mul_matrix_matrix } from "../../js/utils/utils_math.js";
        import { ParametricCurveUnitCircle } from "../../js/utils/utils_parametric_curves.js";

        function create_rot_mat(theta) {
            const cos = Math.cos(theta);
            const sin = Math.sin(theta);
            return [[cos, -sin], [sin, cos]];
        }

        function getDet(matrix) {
            return matrix[0][0] * matrix[1][1] - matrix[0][1] * matrix[1][0];
        }

        const engine = ThreeEngine.new_default_2d();
        const MESH_INDEX = 0;
        
        engine.add_standard2Dshape_as_mesh_object(0x00eeff);
        
        const originalMeshPoints = engine.get_local_vertex_positions_of_mesh_object(MESH_INDEX);
        const originalWireframePoints = engine.get_local_vertex_positions_of_mesh_object_wireframe(MESH_INDEX);

        const unitCircle = new ParametricCurveUnitCircle();
        unitCircle.spawn_static_parametric_curve(engine.scene);

        const settings = {
            drawPoints: true,
            drawWireframe: true,
            drawMesh: false,
            pointSize: 0.02,
            theta: 0,
            determinant: "1"
        };

        const gui = get_default_lil_gui();
        
        // Display controls
        gui.add(settings, 'drawPoints').name('Draw Points');
        gui.add(settings, 'drawWireframe').name('Draw Wireframe');
        gui.add(settings, 'drawMesh').name('Draw Mesh');
        gui.add(settings, 'pointSize', 0.001, 0.03).name('Point Size');

        const matrixFolder = gui.addFolder('Matrix Controls');
        matrixFolder.add(settings, 'theta', -Math.PI, Math.PI).name('theta');
        matrixFolder.add({ reset: () => { settings.theta = 0; refresh_displays(gui); } }, 'reset').name('Reset Matrix');
        matrixFolder.add(settings, 'determinant').name('Determinant').disable();

        // ---- Animation Loop ----        
        engine.animation_loop(() => {
            const rotMat = create_rot_mat(settings.theta);
            const c1 = [rotMat[0][0], rotMat[1][0]];
            const c2 = [rotMat[0][1], rotMat[1][1]];

            engine.draw_debug_vector([0, 0], c1, 0.035, undefined, 0xFF0000);
            engine.draw_debug_vector([0, 0], c2, 0.035, undefined, 0x008000);

            settings.determinant = getDet(rotMat).toFixed(4);
            refresh_displays(gui);

            const transformedMeshPoints = originalMeshPoints.map(p => mul_matrix_matrix(rotMat, p));
            const transformedWireframePoints = originalWireframePoints.map(p => mul_matrix_matrix(rotMat, p));

            engine.update_vertex_positions_of_mesh_object(MESH_INDEX, transformedMeshPoints);
            engine.update_vertex_positions_of_mesh_object_wireframe(MESH_INDEX, transformedWireframePoints);

            if (settings.drawPoints) {
                transformedMeshPoints.forEach(point => {engine.draw_debug_sphere(point, settings.pointSize, 0xFFFF00);});
            }

            engine.mesh_objects[MESH_INDEX].visible = settings.drawMesh;
            engine.set_mesh_object_wireframe_visibility(MESH_INDEX, settings.drawWireframe);
        });
    </script>
</body>
</html>
